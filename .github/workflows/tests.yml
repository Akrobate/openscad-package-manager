name: Tests

on:
  push:
    tags:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Télécharger les dépendances
        run: go mod download

      - name: Vérifier le formatage
        run: |
          test -z "$(gofmt -l .)"

      - name: Lancer les tests
        run: go test ./...